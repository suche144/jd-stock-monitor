name: 京东库存监控

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: 获取代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 运行京东库存监控
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
          JD_AREA: "19_1607_0_0"
        run: python jd_monitor.py
